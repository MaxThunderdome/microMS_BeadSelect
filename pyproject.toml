[project]
name = "microms-beadtargeting"
version = "1.1.0"
description = "Image-guided MALDI-MSI targeting of SPPS resin beads on ITO slides for a Bruker timsTOF fleX"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
]

# Deliberately a single script, not a package. Configuration is the
# CONFIG dict at the top of that file. See CLAUDE.md before
# restructuring.

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
